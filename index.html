<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#0b0f14">
    <meta name="description" content="Gestor de enlaces Ace Stream">

    <title>Gestor Ace Stream</title>

    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <!-- CABECERA -->
    <header class="cabecera">

        <div class="logo-area">
            <div class="logo-icon">▶</div>

            <div>
                <h1>ACE STREAM</h1>
                <span>GESTOR DE ENLACES</span>
            </div>
        </div>

        <div class="contador">
            <span id="contadorEnlaces">0</span>
            <small>ENLACES</small>
        </div>

    </header>


    <!-- CONTENIDO PRINCIPAL -->
    <main class="contenedor">

        <!-- BARRA DE HERRAMIENTAS -->
        <section class="herramientas">

            <div class="buscador">

                <span class="icono-busqueda">⌕</span>

                <input
                    type="text"
                    id="buscador"
                    placeholder="Buscar por nombre, ID o nota..."
                    autocomplete="off"
                >

                <button
                    id="limpiarBusqueda"
                    class="boton-limpiar"
                    title="Limpiar búsqueda">
                    ×
                </button>

            </div>

            <button
                id="recargar"
                class="boton-recargar"
                title="Recargar enlaces">
                ↻
                <span>RECARGAR</span>
            </button>

        </section>


        <!-- MENSAJES -->
        <div id="mensaje" class="mensaje"></div>


        <!-- LISTADO -->
        <section id="listaEnlaces" class="lista-enlaces">
        </section>


        <!-- SIN RESULTADOS -->
        <section id="sinResultados" class="sin-resultados oculto">

            <div class="sin-resultados-icono">⌕</div>

            <h2>No se encontraron enlaces</h2>

            <p>
                Prueba con otro nombre, ID o nota.
            </p>

        </section>

    </main>


    <!-- PIE -->
    <footer class="pie">

        <span>GESTOR DE ENLACES</span>

        <span class="separador">•</span>

        <span id="estadoConexion">Cargando...</span>

    </footer>


    <script src="app.js"></script>

</body>
</html>
